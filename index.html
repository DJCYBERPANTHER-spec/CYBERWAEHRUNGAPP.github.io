<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER WÄHRUNG APP</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a1a; color: #f0f0f0; padding: 20px; }
  .login, .app { max-width: 450px; margin: 30px auto; padding: 20px; background: #2a2a2a; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; }
  input { border: 1px solid #555; background: #1a1a1a; color: #f0f0f0; }
  button { border: none; background: #00c8ff; color: black; font-weight: bold; cursor: pointer; }
  button:hover { background: #0096b3; }
  h2, h3 { text-align: center; }
  #wallet { font-weight: bold; color: #00ff9c; }
  #txMessage, #generatedLink, #receivedMessage { word-break: break-all; text-align: center; margin-top: 10px; }
  #qrCode { text-align:center; margin-top:10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginDiv">
  <h2>CYBER WÄHRUNG APP</h2>
  <div id="setupDiv">
    <p>Bitte Passwort festlegen:</p>
    <input type="password" id="newPassword" placeholder="Neues Passwort">
    <button onclick="setupPassword()">Passwort speichern</button>
  </div>
  <div id="loginFormDiv" style="display:none;">
    <p>Bitte Passwort eingeben:</p>
    <input type="password" id="password" placeholder="Passwort eingeben">
    <button onclick="checkPassword()">Login</button>
  </div>
  <p id="loginMessage" style="color:red;"></p>
</div>

<!-- APP -->
<div class="app" id="appDiv" style="display:none;">
  <h2>Willkommen!</h2>
  <p>Dein CYBER-Guthaben: <span id="wallet">1000</span> CYBER</p>

  <h3>Transaktion senden</h3>
  <input type="text" id="receiver" placeholder="Empfänger-Name">
  <input type="number" id="amount" placeholder="Betrag">
  <button onclick="sendCyber()">Transaktion generieren</button>
  <p id="txMessage" style="color:#00ff9c;"></p>

  <div id="qrCode"></div>
  <button onclick="downloadQRCode()">QR-Code herunterladen</button>

  <h3>QR-Code empfangen</h3>
  <input type="file" id="qrUpload" accept="image/*">
  <button onclick="readQRCode()">QR-Code lesen</button>
  <p id="receivedMessage" style="color:#00ff9c;"></p>

  <button onclick="logout()">Logout</button>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>

<script>
// Wallet starten
let wallet = 1000;
let currentTxData = "";

// Prüfen, ob Passwort schon gesetzt ist
window.onload = function() {
  const storedHash = localStorage.getItem("cyberPasswordHash");
  if(storedHash) {
    document.getElementById("setupDiv").style.display = "none";
    document.getElementById("loginFormDiv").style.display = "block";
  }
  // Optional: laden von geteilten QR-Transaktionen (wie vorher)
  const urlParams = new URLSearchParams(window.location.search);
  const tx = urlParams.get('tx');
  if(tx) {
    document.getElementById("loginDiv").style.display = "none";
    document.getElementById("appDiv").style.display = "block";
    document.getElementById("receivedMessage").innerText = decodeURIComponent(tx);
  }
};

// Passwort-Setup
function setupPassword() {
  const pwd = document.getElementById("newPassword").value.trim();
  if(pwd.length < 4) {
    document.getElementById("loginMessage").innerText = "Passwort muss mindestens 4 Zeichen haben!";
    return;
  }
  const hash = CryptoJS.MD5(pwd).toString();
  localStorage.setItem("cyberPasswordHash", hash);
  document.getElementById("loginMessage").innerText = "Passwort gespeichert!";
  document.getElementById("setupDiv").style.display = "none";
  document.getElementById("loginFormDiv").style.display = "block";
}

// LOGIN
function checkPassword() {
  const pwd = document.getElementById("password").value;
  const hash = CryptoJS.MD5(pwd).toString();
  const storedHash = localStorage.getItem("cyberPasswordHash");
  if(hash === storedHash) {
    document.getElementById("loginDiv").style.display = "none";
    document.getElementById("appDiv").style.display = "block";
    updateWallet();
  } else {
    document.getElementById("loginMessage").innerText = "Falsches Passwort!";
  }
}

// WALLET UPDATE
function updateWallet() { document.getElementById("wallet").innerText = wallet; }

// LOGOUT
function logout() {
  document.getElementById("password").value = "";
  document.getElementById("receiver").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("txMessage").innerText = "";
  document.getElementById("receivedMessage").innerText = "";
  document.getElementById("qrCode").innerHTML = "";
  document.getElementById("appDiv").style.display = "none";
  document.getElementById("loginDiv").style.display = "block";
}

// TRANSAKTION GENERIEREN
function sendCyber() {
  const receiver = document.getElementById("receiver").value.trim();
  const amount = Number(document.getElementById("amount").value);
  if(!receiver || amount <=0) { document.getElementById("txMessage").innerText = "Empfänger und Betrag korrekt eingeben!"; return;}
  if(amount > wallet) { document.getElementById("txMessage").innerText = "Nicht genügend CYBER!"; return;}

  wallet -= amount;
  updateWallet();

  currentTxData = JSON.stringify({receiver, amount});
  document.getElementById("txMessage").innerText = `Transaktion erstellt für ${receiver}, ${amount} CYBER`;

  // QR-Code generieren
  document.getElementById("qrCode").innerHTML = "";
  new QRCode(document.getElementById("qrCode"), {
    text: currentTxData,
    width: 200,
    height: 200,
    colorDark: "#00ff9c",
    colorLight: "#1a1a1a"
  });
}

// QR-CODE DOWNLOAD
function downloadQRCode() {
  const qrCanvas = document.querySelector('#qrCode canvas');
  if(!qrCanvas) { alert("Bitte zuerst eine Transaktion erstellen!"); return; }
  const link = document.createElement("a");
  link.href = qrCanvas.toDataURL();
  link.download = "CYBER_Transaktion.png";
  link.click();
}

// QR-CODE LESEN
function readQRCode() {
  const file = document.getElementById("qrUpload").files[0];
  if(!file) { alert("Bitte QR-Code Bild auswählen"); return; }

  const reader = new FileReader();
  reader.onload = function() {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      if(code) {
        const data = JSON.parse(code.data);
        wallet += Number(data.amount);
        updateWallet();
        document.getElementById("receivedMessage").innerText = `Empfangen: ${data.amount} CYBER von ${data.receiver}`;
      } else {
        document.getElementById("receivedMessage").innerText = "Kein gültiger QR-Code erkannt!";
      }
    }
    img.src = reader.result;
  }
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
